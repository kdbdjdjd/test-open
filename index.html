<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мой день — список задач</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172c29;background:#eef3ef}
*{box-sizing:border-box}body{margin:0;padding:64px 20px}main{max-width:680px;margin:auto}
.brand{font-size:12px;letter-spacing:3px;font-weight:700;color:#487267}h1{font-size:clamp(36px,7vw,56px);letter-spacing:-2px;margin:24px 0 8px}
.subtitle{color:#65756d;margin:0 0 32px;line-height:1.6}.card{background:#fff;border:1px solid #dde5df;border-radius:24px;padding:24px;box-shadow:0 15px 50px #193b2910}
form{display:flex;gap:10px}input[type=text]{min-width:0;flex:1;padding:15px;border:1px solid #ccd9d0;border-radius:12px;font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:#eaf1ed;color:#284a3a}
form button{background:#225c46;color:white}button:hover{filter:brightness(.95)}:focus-visible{outline:3px solid #7bac93;outline-offset:3px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:24px 0 16px}.filters button{font-size:13px;background:transparent}.filters button[aria-pressed=true]{background:#eaf1ed;font-weight:700}
ul{padding:0;margin:0;list-style:none}li{display:flex;align-items:center;gap:12px;border-bottom:1px solid #edf1ee;padding:16px 0}li label{display:flex;align-items:center;gap:12px;flex:1;min-width:0}li span{overflow-wrap:anywhere}input[type=checkbox]{width:20px;height:20px;accent-color:#225c46;flex-shrink:0}li.done span{text-decoration:line-through;color:#8a9690}.remove{padding:6px 10px;background:transparent;color:#7c8780;font-size:20px}
#empty{text-align:center;padding:32px 10px;color:#819087;line-height:1.7}footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;font-size:13px;color:#718077}footer button{font-size:12px}#notice{color:#a14422;font-size:13px}.note{text-align:center;color:#839087;font-size:12px;margin-top:24px}
@media(max-width:480px){body{padding:36px 14px}.card{padding:18px}form{flex-direction:column}footer{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main>
<div class="brand">МАЛЕНЬКИЕ ШАГИ · БОЛЬШИЕ ПЛАНЫ</div>
<h1>Мой день<span style="color:#6f9f7d">.</span></h1>
<p class="subtitle">Освободите голову. Запишите главное и двигайтесь по одной задаче.</p>
<section class="card" aria-label="Список задач">
<form id="form"><input id="task" type="text" aria-label="Новая задача" placeholder="Что нужно сделать?" maxlength="300" required autocomplete="off"><button>Добавить +</button></form>
<nav class="filters" aria-label="Фильтр задач"><button type="button" data-filter="all" aria-pressed="true">Все</button><button type="button" data-filter="active" aria-pressed="false">В работе</button><button type="button" data-filter="done" aria-pressed="false">Готово</button></nav>
<ul id="list"></ul><p id="empty">Здесь пока тихо.<br>Добавьте первую задачу выше.</p>
<footer><span id="count" role="status"></span><button id="clear" type="button">Убрать выполненные</button></footer><p id="notice" role="alert" hidden></p>
</section><p class="note">Задачи сохраняются в этом браузере</p>
</main>
<script>
const key='test-open-tasks-v1';
let tasks=[],filter='all';
const list=document.querySelector('#list'),input=document.querySelector('#task'),notice=document.querySelector('#notice');
try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))tasks=saved.filter(t=>t&&typeof t.id==='string'&&typeof t.text==='string'&&typeof t.done==='boolean');}catch{notice.hidden=false;notice.textContent='Не удалось загрузить сохранённые задачи.';}
function save(){try{localStorage.setItem(key,JSON.stringify(tasks));}catch{notice.hidden=false;notice.textContent='Браузер не разрешает сохранение. Задачи доступны до закрытия страницы.';}render();}
function render(){
 list.replaceChildren();
 const visible=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));
 for(const task of visible){
  const li=document.createElement('li');li.classList.toggle('done',task.done);
  const label=document.createElement('label'),check=document.createElement('input'),text=document.createElement('span'),remove=document.createElement('button');
  check.type='checkbox';check.checked=task.done;check.addEventListener('change',()=>{task.done=check.checked;save();});
  text.textContent=task.text;label.append(check,text);
  remove.type='button';remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label','Удалить: '+task.text);remove.addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!==task.id);save();});
  li.append(label,remove);list.append(li);
 }
 document.querySelector('#empty').hidden=visible.length>0;
 document.querySelector('#empty').textContent=tasks.length?'В этом разделе пока нет задач.':'Пока нет задач. Добавьте первую выше.';
 document.querySelector('#count').textContent='Осталось: '+tasks.filter(t=>!t.done).length+' · Всего: '+tasks.length;
 document.querySelector('#clear').disabled=!tasks.some(t=>t.done);
}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;tasks.push({id:crypto.randomUUID(),text,done:false});input.value='';save();input.focus();});
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();}));
document.querySelector('#clear').addEventListener('click',()=>{tasks=tasks.filter(t=>!t.done);save();});
render();
</script></body></html>
